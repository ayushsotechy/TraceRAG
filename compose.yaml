services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - tracerag-data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "src/tracerag/ui/app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      TRACERAG_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  neo4j:
    image: neo4j:2026.06.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tracerag-password}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1' | cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-tracerag-password}'"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  tracerag-data:
  neo4j-data:
