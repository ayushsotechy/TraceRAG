[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracerag"
version = "0.1.0"
description = "Evaluation-first RAG assistant with hybrid retrieval and citations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "neo4j>=6.0,<7",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<6",
  "python-multipart>=0.0.9,<1",
  "rank-bm25>=0.2.2,<1",
  "streamlit>=1.38,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
ml = [
  "sentence-transformers>=3,<4",
]
openai = [
  "openai>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracerag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --cov=tracerag --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/tracerag/api/main.py" = ["E501"]

[tool.mypy]
strict = true
packages = ["tracerag"]
