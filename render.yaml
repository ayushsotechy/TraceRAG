services:
  - type: web
    name: tracerag-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: RERANKER_PROVIDER
        value: none
      - key: GENERATION_PROVIDER
        value: extractive
      - key: ENTITY_EXTRACTION_PROVIDER
        value: local
      - key: RETRIEVAL_MODE
        value: hybrid

  - type: web
    name: tracerag-ui
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn tracerag.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: RERANKER_PROVIDER
        value: none
      - key: GENERATION_PROVIDER
        value: extractive
      - key: ENTITY_EXTRACTION_PROVIDER
        value: local
      - key: RETRIEVAL_MODE
        value: hybrid
