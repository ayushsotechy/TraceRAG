services:
  - type: web
    name: tracerag-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: RERANKER_PROVIDER
        value: none
      - key: GENERATION_PROVIDER
        value: extractive
      - key: ENTITY_EXTRACTION_PROVIDER
        value: local
      - key: RETRIEVAL_MODE
        value: hybrid

  - type: web
    name: tracerag-ui
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run src/tracerag/ui/app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true
    healthCheckPath: /_stcore/health
    envVars:
      - key: TRACERAG_API_URL
        value: https://tracerag-api.onrender.com
